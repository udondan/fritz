---
name: Test

# All tests run against recorded fixtures and the simulator. Nothing in CI talks
# to a real device.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

# A new push to a pull request makes its running checks obsolete. Runs on main
# are never cancelled.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. Pull requests restore it but don't add
          # their own entries, which keeps the cache storage small.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # Coverage of main is uploaded as well, as the base Codecov compares
      # pull requests against.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: lcov.info

  # Codecov reports its checks asynchronously. This job waits for them, so the
  # required job can depend on the coverage result.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  qlty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # The only required status check. Every job must have run and succeeded: a
  # skipped job must never let a PR become mergeable, least of all through
  # automerge. Only coverage may be skipped: it is skipped on main and when
  # build didn't succeed, and build fails this job then anyway.
  required:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - actions
      - build
      - coverage
      - qlty
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and (.key != "coverage" or .value.result != "skipped")) | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::Not all jobs succeeded:"
            echo "$failed"
            exit 1
          fi
          echo 'Success'
