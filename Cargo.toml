[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/udondan/fritz"
authors = ["Daniel Schroeder"]

# Library crates (tr064, fritz-core, fritz-sim) use regular version
# requirements, so their users don't run into version conflicts. The fritz binary declares its
# own dependencies with exact versions. Cargo.lock pins every build.
[workspace.dependencies]
tr064 = { path = "crates/tr064", version = "0.1.2" }
fritz-core = { path = "crates/fritz-core", version = "0.2.1" }
fritz-sim = { path = "crates/fritz-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
