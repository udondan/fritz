[package]
name = "tr064"
version = "0.0.0"
description = "Vendor-neutral client for the TR-064 (UPnP/SOAP) device management protocol"
keywords = ["tr-064", "upnp", "soap", "router"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
getrandom = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false }
roxmltree = "0.21.2"
secrecy = "0.10.3"
sha2 = "0.11.1"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
