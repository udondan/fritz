[package]
name = "tr064"
version = "0.1.1"
description = "Vendor-neutral client for the TR-064 (UPnP/SOAP) device management protocol"
keywords = ["tr-064", "upnp", "soap", "router"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
roxmltree = "0.21.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
sha2 = "0.11.1"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
