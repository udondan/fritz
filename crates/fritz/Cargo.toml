[package]
name = "fritz"
version = "0.0.0"
description = "CLI and MCP server for FRITZ!Box routers (unofficial, not affiliated with FRITZ! GmbH)"
keywords = ["fritzbox", "mcp", "cli", "tr-064"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.6.9", features = ["derive"] }
fritz-core.workspace = true
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
tr064.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }
