[package]
name = "fritz"
version = "0.1.1"
description = "CLI and MCP server for FRITZ!Box routers (unofficial, not affiliated with FRITZ! GmbH)"
keywords = ["fritzbox", "mcp", "cli", "tr-064"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `fritz change`: plans and applies changes. Off by default, so that builds
# without it can only read.
write = ["fritz-core/write"]

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.9", features = ["derive", "env"] }
clap_complete = { version = "=4.6.12", features = ["unstable-dynamic"] }
fritz-core.workspace = true
png = "=0.18.1"
qrcode = { version = "=0.15.0", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rpassword = "=7.5.5"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
secrecy = "=0.10.3"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["serialize"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }
tr064.workspace = true
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
fritz-sim.workspace = true
keyring-core = "=1.0.1"
rmcp = { version = "=3.11.0", features = ["client", "transport-child-process"] }
rqrr = { version = "=0.11.0", default-features = false }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "test-util"] }
