[package]
name = "fritz-core"
version = "0.1.1"
description = "FRITZ!Box specific logic for the fritz CLI and MCP server (unofficial, not affiliated with FRITZ! GmbH)"
readme = "README.md"
keywords = ["fritzbox", "tr-064", "router"]
categories = ["network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Changes to devices: `change::Changer`. Off by default, so that builds
# without it can only read.
write = ["dep:getrandom"]

[dependencies]
directories = "6.0.0"
getrandom = { version = "0.4.3", optional = true }
keyring-core = "1.0.1"
md-5 = "0.11.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
regex = "1.13.2"
roxmltree = "0.21.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
toml = "1.2.1"
tr064.workspace = true
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
fritz-sim.workspace = true
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }
