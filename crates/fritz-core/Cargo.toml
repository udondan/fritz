[package]
name = "fritz-core"
version = "0.0.0"
description = "FRITZ!Box specific logic for the fritz CLI and MCP server (unofficial, not affiliated with FRITZ! GmbH)"
keywords = ["fritzbox", "tr-064", "router"]
categories = ["network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
regex = "1.13.2"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tr064.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }
